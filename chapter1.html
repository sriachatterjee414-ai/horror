<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Aetheria — Chapter I</title>

    <link rel="stylesheet" href="chapter1.css">

</head>

<body>

<div id="game">

    <!-- SCENE -->
    <div id="scene"></div>

    <!-- CINEMATIC OVERLAYS -->
    <div id="vignette"></div>

    <div id="grain"></div>

    <div id="particles"></div>


    <!-- SKIP -->
    <button id="skipIntro">
        SKIP INTRO
    </button>


    <!-- CHAPTER TITLE -->

    <div id="chapterTitle">

        <p>PART I</p>

        <h1>THE RETURN</h1>

        <span>Some places remember.</span>

    </div>


    <!-- DIALOGUE -->

    <div id="dialogueBox">

        <div id="speaker"></div>

        <div id="dialogueText"></div>

        <div id="nextIcon">
            ✦
        </div>

    </div>


    <!-- CHOICES -->

    <div id="choices"></div>


    <!-- NAME INPUT -->

    <div id="nameScreen">

        <div class="namePanel">

            <p>A NAME FROM BEFORE</p>

            <h2>What was your name?</h2>

            <input
                id="playerName"
                maxlength="20"
                placeholder="Your name..."
            >

            <button id="nameSubmit">
                CONTINUE ✦
            </button>

        </div>

    </div>


    <!-- FLASH -->

    <div id="flash"></div>


</div>

<script src="chapter1.js"></script>

</body>

</html>
