<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DEAD MAN DON'T TALK</title>


    <!-- MAIN GAME CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >


    <!-- CHAPTER 2 CSS -->

    <link
        rel="stylesheet"
        href="chapter2.css"
    >


    <!-- FONTS -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Cinzel:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap"
        rel="stylesheet"
    >

</head>


<body>


<div id="game-container">


    <!-- =================================================
         BACKGROUND
    ================================================= -->

    <div
        id="bg-layer"
        class="bg-layer"
    ></div>


    <div
        id="ambient-glow"
    ></div>


    <div
        id="flash-overlay"
        class="flash-overlay"
    ></div>


    <div
        id="vignette"
    ></div>


    <!-- =================================================
         VIDEO / CUTSCENE
    ================================================= -->

    <div
        id="video-container"
        class="hidden"
    >

        <video
            id="cutscene-player"
            playsinline
            preload="auto"
        ></video>


        <button
            id="skip-intro-btn"
            class="skip-btn"
            type="button"
        >
            SKIP
        </button>

    </div>


    <!-- =================================================
         START SCREEN
    ================================================= -->

    <div
        id="start-overlay"
        class="overlay-screen active"
    >

        <div class="title-box">

            <div class="tiny-label">
                AN INTERACTIVE MYSTERY
            </div>


            <h1 class="glow-title">

                DEAD MAN

                <span>
                    DON'T TALK
                </span>

            </h1>


            <div class="title-line">

                <span></span>

                ✦

                <span></span>

            </div>


            <p class="subtitle">
                Some memories should stay buried.
            </p>


            <button
                id="start-game-btn"
                class="glow-btn start-button"
                type="button"
            >

                ENTER GAME

                <span class="button-arrow">
                    →
                </span>

            </button>


            <div class="title-hint">
                click to begin
            </div>

        </div>

    </div>


    <!-- =================================================
         CHAPTER SELECT
    ================================================= -->

    <div
        id="chapter-menu"
        class="overlay-screen hidden"
    >

        <div class="menu-box">

            <div class="menu-small-title">
                THE STORY
            </div>


            <h2>
                CHAPTER SELECT
            </h2>


            <div class="menu-line">

                <span></span>

                ✦

                <span></span>

            </div>


            <div class="chapter-buttons">


                <button
                    class="ch-btn"
                    type="button"
                    onclick="startChapter(1)"
                >

                    <span class="chapter-number">
                        I
                    </span>

                    <span class="chapter-info">

                        <strong>
                            The Return
                        </strong>

                        <small>
                            Chapter 1
                        </small>

                    </span>

                    <span class="chapter-arrow">
                        →
                    </span>

                </button>


                <button
                    class="ch-btn"
                    type="button"
                    onclick="startChapter(2)"
                >

                    <span class="chapter-number">
                        II
                    </span>

                    <span class="chapter-info">

                        <strong>
                            The House Doesn't Forget
                        </strong>

                        <small>
                            Chapter 2
                        </small>

                    </span>

                    <span class="chapter-arrow">
                        →
                    </span>

                </button>


                <button
                    class="ch-btn disabled"
                    type="button"
                >

                    <span class="chapter-number">
                        III
                    </span>

                    <span class="chapter-info">

                        <strong>
                            Coming Soon
                        </strong>

                        <small>
                            Chapter 3
                        </small>

                    </span>

                    <span class="chapter-lock">
                        ✦
                    </span>

                </button>


            </div>

        </div>

    </div>


    <!-- =================================================
         NAME MODAL
    ================================================= -->

    <div
        id="name-modal"
        class="overlay-modal hidden"
    >

        <div class="modal-box">

            <div class="modal-label">
                A NAME LOST TO MEMORY
            </div>


            <label for="player-name-input">
                What was your name again?
            </label>


            <input
                id="player-name-input"
                type="text"
                maxlength="20"
                placeholder="Y/N"
                autocomplete="off"
            >


            <button
                id="confirm-name-btn"
                class="glow-btn"
                type="button"
            >
                Remember
            </button>

        </div>

    </div>


    <!-- =================================================
         CHOICES
    ================================================= -->

    <div
        id="choice-container"
        class="choice-box hidden"
    ></div>


    <!-- =================================================
         DIALOGUE
    ================================================= -->

    <div
        id="dialogue-box"
        class="dialogue-container hidden"
    >

        <div
            id="speaker-name"
            class="speaker-tag"
        ></div>


        <div
            id="dialogue-text"
            class="dialogue-content"
        ></div>


        <div class="dialogue-bottom-line"></div>


        <div class="click-indicator">
            ▼
        </div>

    </div>


</div>


<!-- =====================================================
     CHAPTER DATA
===================================================== -->

<script src="c1.js"></script>

<script src="c2.js"></script>

<script src="c3.js"></script>


<!-- =====================================================
     MAIN GAME ENGINE
===================================================== -->

<script src="script.js"></script>


<!-- =====================================================
     CHAPTER 2
===================================================== -->

<script src="chapter2.js"></script>


<script>

/*
==========================================================
CHAPTER 2 BUTTON
==========================================================
*/

window.startChapter2FromMenu = function () {

    const menu =
        document.getElementById(
            "chapter-menu"
        );

    if (menu) {

        menu.classList.add(
            "hidden"
        );
    }


    if (
        typeof window.startChapter2 ===
        "function"
    ) {

        window.startChapter2();

    } else {

        console.error(
            "chapter2.js was not loaded."
        );
    }

};


/*
==========================================================
OVERRIDE CHAPTER SELECTOR FOR CHAPTER 2
==========================================================
*/

const oldStartChapter =
    window.startChapter;


window.startChapter =
    function(number) {

        if (number === 2) {

            startChapter2FromMenu();

            return;
        }


        if (
            typeof oldStartChapter ===
            "function"
        ) {

            oldStartChapter(number);

        }

    };

</script>


</body>

</html>
