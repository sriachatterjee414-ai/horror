<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>DEAD MAN DON'T TALK</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Caveat:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">

</head><body><div id="game-container"><!-- ================= BACKGROUND ================= -->

<div id="bg-layer" class="bg-layer"></div>

<div class="ambient-glow glow-one"></div>
<div class="ambient-glow glow-two"></div>
<div class="ambient-glow glow-three"></div>

<div class="floating-doodles" aria-hidden="true">
    <span class="doodle doodle-star">✦</span>
    <span class="doodle doodle-star-two">✧</span>
    <span class="doodle doodle-cross">＋</span>
    <span class="doodle doodle-dot">•</span>
    <span class="doodle doodle-dot-two">·</span>
    <span class="doodle doodle-line">〰</span>
    <span class="doodle doodle-circle">○</span>
    <span class="doodle doodle-spark">⋆</span>
</div>

<div class="grain"></div>

<div id="flash-overlay" class="flash-overlay"></div>
<div id="vignette"></div>


<!-- ================= CUTSCENE ================= -->

<div id="video-container" class="hidden">

    <video
        id="cutscene-player"
        src="intro.webm"
        playsinline>
    </video>

    <button id="skip-intro-btn" class="skip-btn">
        SKIP INTRO
    </button>

</div>


<!-- ================= START SCREEN ================= -->

<div id="start-overlay" class="overlay-screen active">

    <div class="menu-decoration decoration-top">✦ ───── ✧ ───── ✦</div>

    <div class="title-box">

        <div class="little-note">
            <span>✎</span> an interactive mystery
        </div>

        <h1 class="glow-title">
            DEAD MAN
            <span>DON'T TALK</span>
        </h1>

        <div class="title-line">
            <span></span>
            <b>✦</b>
            <span></span>
        </div>

        <p class="subtitle">
            Some secrets are better left buried.
        </p>

        <button id="start-game-btn" class="glow-btn">

            <span class="btn-spark spark-left">✦</span>

            <span class="btn-text">
                ENTER GAME
            </span>

            <span class="btn-arrow">→</span>

            <span class="btn-spark spark-right">✧</span>

        </button>

        <div class="tiny-writing">
            click to begin
        </div>

    </div>

    <div class="menu-decoration decoration-bottom">
        〰 ───── • ───── 〰
    </div>

</div>


<!-- ================= CHAPTER SELECT ================= -->

<div id="chapter-menu" class="overlay-screen hidden">

    <div class="menu-box">

        <div class="menu-small-title">
            THE STORY
        </div>

        <h2>
            CHAPTER SELECT
        </h2>

        <div class="menu-line">
            <span></span>
            <b>✦</b>
            <span></span>
        </div>

        <div class="chapter-buttons">

            <button class="ch-btn" onclick="startChapter(1)">

                <span class="chapter-number">01</span>

                <span class="chapter-info">
                    <strong>THE RETURN</strong>
                    <small>Part One</small>
                </span>

                <span class="chapter-arrow">→</span>

            </button>


            <button class="ch-btn" onclick="startChapter(2)">

                <span class="chapter-number">02</span>

                <span class="chapter-info">
                    <strong>SHADOWS</strong>
                    <small>Part Two</small>
                </span>

                <span class="chapter-arrow">→</span>

            </button>


            <button class="ch-btn disabled">

                <span class="chapter-number">03</span>

                <span class="chapter-info">
                    <strong>UNKNOWN</strong>
                    <small>Coming Soon</small>
                </span>

                <span class="chapter-lock">✦</span>

            </button>

        </div>

        <div class="menu-footer">
            choose where the story begins...
        </div>

    </div>

</div>


<!-- ================= NAME INPUT ================= -->

<div id="name-modal" class="overlay-modal hidden">

    <div class="modal-box">

        <div class="modal-doodle">
            ✎
        </div>

        <div class="modal-label">
            A NAME...
        </div>

        <label for="player-name-input">
            What was your name again?
        </label>

        <input
            type="text"
            id="player-name-input"
            maxlength="20"
            placeholder="Y/N"
            autocomplete="off"
        >

        <button id="confirm-name-btn" class="glow-btn">
            Confirm →
        </button>

        <div class="modal-note">
            You can always change your mind.
        </div>

    </div>

</div>


<!-- ================= CHOICES ================= -->

<div id="choice-container" class="choice-box hidden"></div>


<!-- ================= DIALOGUE ================= -->

<div id="dialogue-box" class="dialogue-container hidden">

    <div class="dialogue-corner corner-one">✦</div>
    <div class="dialogue-corner corner-two">✧</div>

    <div id="speaker-name" class="speaker-tag"></div>

    <div class="dialogue-divider">
        <span></span>
        <b>✦</b>
        <span></span>
    </div>

    <div id="dialogue-text" class="dialogue-content"></div>

    <div class="click-indicator">
        <span>click</span>
        <b>↓</b>
    </div>

</div>

</div><!-- ================= SCRIPTS ================= --><script src="c1.js"></script><script src="c2.js"></script><script src="c3.js"></script><script src="script.js"></script></body>
</html>
