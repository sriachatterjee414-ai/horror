<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DEAD MAN DON'T TALK</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Cinzel:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap"
        rel="stylesheet"
    >

</head>


<body>

<div id="game-container">

    <!-- =========================================
         BACKGROUND
    ========================================== -->

    <div id="bg-layer" class="bg-layer"></div>

    <div id="ambient-glow"></div>

    <div id="flash-overlay" class="flash-overlay"></div>

    <div id="vignette"></div>


    <!-- =========================================
         VIDEO INTRO
    ========================================== -->

    <div
        id="video-container"
        class="hidden"
    >

        <video
            id="cutscene-player"
            src="intro.webm"
            playsinline
        ></video>

        <button
            id="skip-intro-btn"
            class="skip-btn"
        >
            SKIP INTRO
        </button>

    </div>


    <!-- =========================================
         START SCREEN
    ========================================== -->

    <div
        id="start-overlay"
        class="overlay-screen active"
    >

        <div class="title-decoration top-decoration">
            ✦　·　✧
        </div>

        <div class="title-box">

            <div class="tiny-label">
                AN INTERACTIVE MYSTERY
            </div>

            <h1 class="glow-title">
                DEAD MAN
                <span>DON'T TALK</span>
            </h1>

            <div class="title-line">
                <span></span>
                ✦
                <span></span>
            </div>

            <p class="subtitle">
                Some memories should stay buried.
            </p>

            <button
                id="start-game-btn"
                class="glow-btn start-button"
            >

                <span class="button-doodle left">
                    ✧
                </span>

                <span>
                    ENTER GAME
                </span>

                <span class="button-arrow">
                    →
                </span>

                <span class="button-doodle right">
                    ✦
                </span>

            </button>

            <div class="title-hint">
                <span>click</span>
                to begin
            </div>

        </div>

        <div class="title-decoration bottom-decoration">
            ⋆　·　✧　·　⋆
        </div>

    </div>


    <!-- =========================================
         CHAPTER MENU
    ========================================== -->

    <div
        id="chapter-menu"
        class="overlay-screen hidden"
    >

        <div class="menu-box">

            <div class="menu-small-title">
                THE STORY
            </div>

            <h2>
                CHAPTER SELECT
            </h2>

            <div class="menu-line">
                <span></span>
                ✦
                <span></span>
            </div>

            <div class="chapter-buttons">

                <button
                    class="ch-btn"
                    onclick="startChapter(1)"
                >

                    <span class="chapter-number">
                        I
                    </span>

                    <span class="chapter-info">
                        <strong>
                            The Return
                        </strong>

                        <small>
                            Part 1
                        </small>
                    </span>

                    <span class="chapter-arrow">
                        →
                    </span>

                </button>


                <button
                    class="ch-btn"
                    onclick="startChapter(2)"
                >

                    <span class="chapter-number">
                        II
                    </span>

                    <span class="chapter-info">
                        <strong>
                            Shadows
                        </strong>

                        <small>
                            Part 2
                        </small>
                    </span>

                    <span class="chapter-arrow">
                        →
                    </span>

                </button>


                <button
                    class="ch-btn disabled"
                    onclick="startChapter(3)"
                >

                    <span class="chapter-number">
                        III
                    </span>

                    <span class="chapter-info">
                        <strong>
                            Coming Soon
                        </strong>

                        <small>
                            Part 3
                        </small>
                    </span>

                    <span class="chapter-lock">
                        ✦
                    </span>

                </button>

            </div>

            <div class="menu-note">
                ✎ Choose where the story begins
            </div>

        </div>

    </div>


    <!-- =========================================
         NAME INPUT
    ========================================== -->

    <div
        id="name-modal"
        class="overlay-modal hidden"
    >

        <div class="modal-box">

            <div class="modal-doodle">
                ✧
            </div>

            <div class="modal-label">
                A NAME LOST TO MEMORY
            </div>

            <label
                for="player-name-input"
            >
                What was your name again?
            </label>

            <input
                type="text"
                id="player-name-input"
                maxlength="20"
                placeholder="Y/N"
                autocomplete="off"
            >

            <button
                id="confirm-name-btn"
                class="glow-btn"
            >
                Remember
            </button>

            <div class="modal-hint">
                Press ENTER to continue
            </div>

        </div>

    </div>


    <!-- =========================================
         CHOICES
    ========================================== -->

    <div
        id="choice-container"
        class="choice-box hidden"
    ></div>


    <!-- =========================================
         DIALOGUE
    ========================================== -->

    <div
        id="dialogue-box"
        class="dialogue-container hidden"
    >

        <div class="dialogue-corner top-left">
            ✧
        </div>

        <div class="dialogue-corner bottom-right">
            ✦
        </div>

        <div
            id="speaker-name"
            class="speaker-tag"
        ></div>

        <div
            id="dialogue-text"
            class="dialogue-content"
        ></div>

        <div class="dialogue-bottom-line"></div>

        <div class="click-indicator">
            ▼
        </div>

    </div>

</div>


<!-- =========================================
     CHAPTER SCRIPTS
========================================== -->

<script src="c1.js"></script>
<script src="c2.js"></script>
<script src="c3.js"></script>

<!-- Main engine LAST -->
<script src="script.js"></script>

</body>
</html>
