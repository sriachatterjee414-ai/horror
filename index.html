<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aetheria</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="loading">

        <div class="moon"></div>

        <div class="mist mist1"></div>
        <div class="mist mist2"></div>

        <div class="particles">
            <span>✦</span>
            <span>✧</span>
            <span>·</span>
            <span>♡</span>
            <span>✦</span>
            <span>·</span>
        </div>

        <div class="title">

            <p class="small-title">
                A STORY OF MEMORIES
            </p>

            <h1>AETHERIA</h1>

            <div class="line"></div>

            <p class="subtitle">
                Some memories are better left forgotten.
            </p>

            <button id="startButton">
                <span>START GAME</span>
                <small>✦</small>
            </button>

        </div>

        <div class="warning">
            HEADPHONES RECOMMENDED
        </div>

    </div>

    <div id="transition"></div>

    <script src="script.js"></script>

</body>
</html>
