<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Novel - Chapter Engine</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Main Game Container -->
    <div id="game-container">

        <!-- Background Scene Layers -->
        <div id="bg-layer" class="bg-layer"></div>
        <div id="flash-overlay" class="flash-overlay"></div>
        <div id="vignette"></div>

        <!-- Video Cutscene Container -->
        <div id="video-container" class="hidden">
            <video id="cutscene-player" src="intro.webm" playsinline></video>
            <button id="skip-intro-btn" class="skip-btn">SKIP INTRO</button>
        </div>

        <!-- Start Screen / Loading Overlay -->
        <div id="start-overlay" class="overlay-screen active">
            <div class="title-box">
                <h1 class="glow-title">UNTITLED MEMORY</h1>
                <p class="subtitle">An Interactive Mystery</p>
                <button id="start-game-btn" class="glow-btn">ENTER GAME</button>
            </div>
        </div>

        <!-- Chapter Select Menu -->
        <div id="chapter-menu" class="overlay-screen hidden">
            <div class="menu-box">
                <h2>CHAPTER SELECT</h2>
                <div class="chapter-buttons">
                    <button class="ch-btn" onclick="startChapter(1)">Part 1: The Return</button>
                    <button class="ch-btn" onclick="startChapter(2)">Part 2: Shadows</button>
                    <button class="ch-btn disabled" onclick="startChapter(3)">Part 3 (Coming Soon)</button>
                </div>
            </div>
        </div>

        <!-- Name Input Modal -->
        <div id="name-modal" class="overlay-modal hidden">
            <div class="modal-box">
                <label for="player-name-input">What was your name again?</label>
                <input type="text" id="player-name-input" maxlength="20" placeholder="Y/N" autofocus>
                <button id="confirm-name-btn" class="glow-btn">Confirm</button>
            </div>
        </div>

        <!-- Choices Menu -->
        <div id="choice-container" class="choice-box hidden"></div>

        <!-- Dialogue Box -->
        <div id="dialogue-box" class="dialogue-container hidden">
            <div id="speaker-name" class="speaker-tag"></div>
            <div id="dialogue-text" class="dialogue-content"></div>
            <div class="click-indicator">▼</div>
        </div>

    </div>

    <!-- Embedded Scripts for Chapters -->
    <script src="c1.js"></script>
    <script src="c2.js"></script>
    <script src="c3.js"></script>
    <script src="script.js"></script>
</body>
</html>
